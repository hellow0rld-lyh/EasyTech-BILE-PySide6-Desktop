name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run public test suite
        run: python -m unittest discover -s tests -v

  windows-package:
    name: Build Windows desktop bundle
    needs: unit-tests
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[build]"
      - name: Build one-folder application
        shell: pwsh
        run: .\packaging\build_windows.ps1 -Python python -NoInstall
      - name: Verify bundle entry point
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\BILEWorkbench\BILEWorkbench.exe")) {
            throw "Windows executable was not produced."
          }
      - name: Upload unsigned Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: BILEWorkbench-Windows-x64
          path: dist/BILEWorkbench/
          if-no-files-found: error
          retention-days: 14

  publish-prerelease:
    name: Publish unsigned Windows x64 pre-release
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-')
    needs: windows-package
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
      - name: Download Windows bundle from this run
        uses: actions/download-artifact@v4
        with:
          name: BILEWorkbench-Windows-x64
          path: release/BILEWorkbench
      - name: Archive bundle and create SHA-256 checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $BundleRoot = Join-Path $PWD "release\BILEWorkbench"
          $Executable = Join-Path $BundleRoot "BILEWorkbench.exe"
          if (-not (Test-Path -LiteralPath $Executable -PathType Leaf)) {
            throw "Downloaded bundle is missing BILEWorkbench.exe."
          }
          $ZipPath = Join-Path $PWD "release\BILEWorkbench-Windows-x64.zip"
          $ChecksumPath = "$ZipPath.sha256"
          Compress-Archive -Path (Join-Path $BundleRoot "*") -DestinationPath $ZipPath -CompressionLevel Optimal
          $Hash = (Get-FileHash -LiteralPath $ZipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "{0}  {1}" -f $Hash, (Split-Path -Leaf $ZipPath) | Set-Content -LiteralPath $ChecksumPath -Encoding ascii
      - name: Publish GitHub pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $Tag = $env:GITHUB_REF_NAME
          if (-not $Tag.StartsWith("v") -or -not $Tag.Contains("-")) {
            throw "Unsupported pre-release tag: $Tag"
          }
          $NotesPath = Join-Path "release-notes" "$Tag.md"
          if (-not (Test-Path -LiteralPath $NotesPath -PathType Leaf)) {
            throw "Release notes are missing: $NotesPath"
          }
          $ZipPath = "release\BILEWorkbench-Windows-x64.zip"
          $ChecksumPath = "$ZipPath.sha256"
          gh release create $Tag $ZipPath $ChecksumPath --title "BILE Workbench $Tag" --notes-file $NotesPath --draft --prerelease --verify-tag
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub draft release creation or asset upload failed."
          }
          gh release edit $Tag --draft=false --prerelease
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release publication failed; inspect the remaining draft."
          }
